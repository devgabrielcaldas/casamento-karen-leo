<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeria</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <link id="fontTitle" rel="stylesheet" />
  <link id="fontBody" rel="stylesheet" />
  <link id="fontDate" rel="stylesheet" />
  

  <link rel="stylesheet" href="./css/styles.css" />
</head>

<body>
  <div class="container">
    <div class="card">

      <div class="header header--centered">
        <img class="brand-logo" src="./assets/branding/logo.png" alt="Monograma" />

        <div class="brand brand--center">
          <h1 id="coupleNames">Karen & Leonardo</h1>
          <p id="dateText">12/07/2025</p>
        </div>

        <a class="header-action" href="./index.html">Voltar</a>
      </div>

      <div class="section">
        <div class="empty" id="lockedBox" style="display:none;">
          Você precisa inserir o PIN para acessar a galeria. Volte para a página inicial.
        </div>

        <div id="content">
          <div id="stories" class="stories"></div>

          <div class="face-find">
            <button id="faceFindBtn" class="btn face-find-btn" type="button">
              Ache suas fotos com uma selfie
            </button>
            <p class="help face-find-help">
              Tire uma selfie para encontrar fotos em que você aparece. A imagem é usada apenas para a busca e não é salva.
            </p>
          </div>

          <h2 style="margin-top:6px;">Momentos</h2>
          <div id="sections"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- MODAL (fora do #content, mais limpo e seguro) -->
  <div id="photoModal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" id="modalBackdrop"></div>

    <div class="modal-content card">
      <button class="modal-close" id="modalClose" aria-label="Fechar">✕</button>

      <button class="nav nav-left" id="navLeft" aria-label="Anterior">‹</button>
      <button class="nav nav-right" id="navRight" aria-label="Próxima">›</button>

      <div class="modal-body">
        <div id="imgLoader" class="img-loader">Carregando…</div>
        <img id="modalImage" alt="Foto do casamento" />
      </div>

      <div class="modal-footer">
        <div class="modal-meta">
          <span id="modalTitle" class="modal-title"></span>
          <span id="modalCounter" class="modal-counter"></span>
        </div>

        <div class="modal-actions row">
          <button id="copyBtn" class="btn secondary" type="button">Copiar link</button>
          <a id="downloadBtn" class="btn" href="#" download>Download</a>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/gallery.js"></script>
</body>

</html>
