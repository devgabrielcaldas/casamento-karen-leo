<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeria</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    id="fontTitle"
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <link
    id="fontBody"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./css/styles.css" />
</head>

<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <div class="brand">
          <h1 id="coupleNames">Karen & Leo</h1>
          <p id="dateText">12/07/2025</p>
        </div>

        <div class="row">
          <a class="btn secondary" href="./index.html">Voltar</a>
          <a id="zipBtn" class="btn" href="#" style="display:none;">Baixar álbum (ZIP)</a>
        </div>
      </div>

      <div class="section">
        <div class="empty" id="lockedBox" style="display:none;">
          Você precisa inserir o PIN para acessar a galeria. Volte para a página inicial.
        </div>

        <div id="content">
          <div id="stories" class="stories"></div>

          <h2 style="margin-top:6px;">Momentos</h2>
          <div id="sections"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL (fora do #content, mais limpo e seguro) -->
  <div id="photoModal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" id="modalBackdrop"></div>

    <div class="modal-content card">
      <button class="modal-close" id="modalClose" aria-label="Fechar">✕</button>

      <button class="nav nav-left" id="navLeft" aria-label="Anterior">‹</button>
      <button class="nav nav-right" id="navRight" aria-label="Próxima">›</button>

      <div class="modal-body">
        <div id="imgLoader" class="img-loader">Carregando…</div>
        <img id="modalImage" alt="Foto do casamento" />
      </div>

      <div class="modal-footer">
        <div class="modal-meta">
          <span id="modalTitle" class="modal-title"></span>
          <span id="modalCounter" class="modal-counter"></span>
        </div>

        <div class="modal-actions row">
          <button id="copyBtn" class="btn secondary" type="button">Copiar link</button>
          <a id="downloadBtn" class="btn" href="#" download>Download</a>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/gallery.js"></script>
</body>
</html>
